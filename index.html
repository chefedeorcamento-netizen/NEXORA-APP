<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d17;--surface:#141a2c;--surface-2:#0f1523;--line:#232b42;--line-2:#1a2236;
  --txt:#eaedf7;--txt-2:#9aa2bd;--txt-3:#6b7390;
  --brand:#7c6bff;--brand-2:#6d5ef6;--brand-soft:#221d46;--teal:#2dd4a0;--teal-soft:#0f2a22;
  --danger:#f0666b;--danger-soft:#2c1518;--warn:#f0a23c;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:
  radial-gradient(900px 620px at 84% -10%, rgba(124,107,255,.14), transparent 60%),
  radial-gradient(760px 560px at -5% 112%, rgba(45,212,160,.06), transparent 55%),
  var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Sora,Inter,sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
a{color:var(--brand)}
.mark{display:inline-flex;align-items:center;gap:10px}
.mark svg{width:30px;height:30px}
.mark b{font-family:Sora;font-weight:800;letter-spacing:.5px;font-size:19px}
.hide{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%),var(--surface);border:1px solid rgba(255,255,255,.08);border-radius:20px;box-shadow:var(--shadow);padding:32px}
.lcard .mark{margin-bottom:6px}
.lcard .sub{color:var(--txt-2);font-size:13.5px;margin-bottom:24px}
.lcard .badge{display:inline-block;background:rgba(124,107,255,.16);color:#c3b9ff;font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:20px;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:6px}
.field input{width:100%;padding:12px 13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:#fff}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,107,255,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{width:100%;background:linear-gradient(135deg,#8575ff,#6d5ef6);color:#fff;box-shadow:0 6px 18px rgba(124,107,255,.38);margin-top:6px}
.btn-primary:hover{box-shadow:0 10px 28px rgba(124,107,255,.55)}
.btn-primary:disabled{opacity:.6;cursor:wait;box-shadow:none}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--txt)}
.btn-ghost:hover{border-color:var(--brand)}
.btn-sm{padding:8px 13px;font-size:13px}
.lmsg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:10px;display:none}
.lmsg.err{display:block;background:var(--danger-soft);color:#ff9a9e;border:1px solid rgba(240,102,107,.3)}
.lmsg.ok{display:block;background:var(--teal-soft);color:#7dffcf;border:1px solid rgba(45,212,160,.3)}
.forgot{text-align:center;margin-top:14px;font-size:13px}
.forgot a{color:var(--brand);cursor:pointer}
.forgot a:hover{text-decoration:underline}

/* APP SHELL */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:62px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.06);background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.topbar .mark b{font-size:17px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(45,212,160,.2)}
.pill.sa{background:rgba(124,107,255,.14);border-color:rgba(124,107,255,.3);color:#c3b9ff}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#4ea3ff);color:#fff;display:grid;place-items:center;font-weight:700;font-family:Sora;font-size:13px}
.content{flex:1;padding:26px;max-width:1080px;margin:0 auto;width:100%}
.phead{margin-bottom:20px}
.phead h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.phead p{color:var(--txt-2);margin-top:3px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 42%),var(--surface);border:1px solid rgba(255,255,255,.075);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi .lab{color:var(--txt-2);font-size:12.5px}
.kpi .val{font-family:Sora;font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.6px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 42%),var(--surface);border:1px solid rgba(255,255,255,.075);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:140px}
.row label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:6px}
.inp{width:100%;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;color:var(--txt)}
.inp:focus{outline:none;border-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:11px 14px;color:var(--txt-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line-2)}
tr:last-child td{border-bottom:none}
.empty{text-align:center;color:var(--txt-3);padding:34px 16px;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:11px;box-shadow:var(--shadow);font-size:13.5px;font-weight:500;z-index:50;opacity:0;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.muted{color:var(--txt-3);font-size:12.5px}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:var(--txt-2);gap:10px}
/* CRM do cliente */
.crm{display:flex;gap:18px;align-items:flex-start}
@media(max-width:720px){.crm{flex-direction:column}}
.crm-side{width:210px;flex:none;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 42%),var(--surface);border:1px solid rgba(255,255,255,.075);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);position:sticky;top:88px}
@media(max-width:720px){.crm-side{width:100%;position:static}}
.crm-emp{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid var(--line-2);margin-bottom:10px}
.crm-emoji{font-size:22px}
.crm-empn{font-family:Sora;font-weight:700;font-size:14px;line-height:1.15}
.crm-nav{display:flex;flex-direction:column;gap:2px}
.crm-nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--txt-2);font-weight:500;font-size:13.5px;cursor:pointer;transition:.13s}
.crm-nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.crm-nav a:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.crm-nav a.on{background:linear-gradient(90deg,rgba(124,107,255,.22),rgba(124,107,255,.05));color:#fff;box-shadow:inset 0 0 0 1px rgba(124,107,255,.22)}
.crm-main{flex:1;min-width:0}
/* dashboard com gráficos */
.kpi.feat{background:linear-gradient(135deg,rgba(124,107,255,.26),rgba(124,107,255,.04)),var(--surface);border-color:rgba(124,107,255,.3);box-shadow:0 10px 30px rgba(124,107,255,.2)}
.dash2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:760px){.dash2{grid-template-columns:1fr}}
.chartbox{position:relative;height:240px}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}
/* prospecção IA */
.prosp-count{font-size:12.5px;color:var(--txt-2);font-weight:600;margin-bottom:12px}
.prosp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prosp-card{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 42%),var(--surface);border:1px solid rgba(255,255,255,.075);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.prosp-card.done{opacity:.68}
.pc-top{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.pc-av{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#4ea3ff);color:#fff;display:grid;place-items:center;font-weight:700;font-family:Sora;font-size:16px;flex:none}
.pc-id{flex:1;min-width:0}.pc-nm{font-weight:700;font-size:14px}.pc-sub{font-size:11.5px;color:var(--txt-3)}
.pc-score{font-family:Sora;font-weight:800;font-size:19px;color:var(--teal);flex:none}
.pc-contact{font-size:12px;color:var(--txt-2);margin-bottom:12px}
.pc-sec{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt-3);margin-bottom:6px}
.pc-sinais{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pc-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.pc-tag.warn{background:rgba(240,162,60,.14);color:#f0a23c}
.pc-tag.serv{background:rgba(124,107,255,.16);color:#c3b9ff}
.admtabs{display:flex;gap:8px;margin-bottom:18px}
.atab{padding:8px 16px;border-radius:10px;font-weight:600;font-size:13.5px;background:var(--surface);border:1px solid var(--line);color:var(--txt-2)}
.atab.on{background:linear-gradient(135deg,#8575ff,#6d5ef6);color:#fff;border-color:transparent}
.admacts{white-space:nowrap;text-align:right}
.admacts .btn{margin-left:8px}
@media(max-width:600px){.admacts{text-align:left}.admacts .btn{margin:4px 8px 0 0}}
.cell-sub{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.cob{font-size:12.5px;font-weight:700}
.cob.ok{color:var(--teal)}.cob.venc{color:var(--danger)}.cob.none{color:var(--txt-3)}
.pc-add{margin-top:auto;justify-content:center;width:100%}
.pc-added{text-align:center;font-weight:700;font-size:12.5px;color:var(--teal);background:var(--teal-soft);border-radius:9px;padding:9px;margin-top:auto}
.prosp-loading svg{animation:prospin 1.1s linear infinite}
@keyframes prospin{to{transform:rotate(360deg)}}
/* funil kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{flex:0 0 240px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:130px}
.kcol.kover{outline:2px dashed var(--brand);outline-offset:-3px}
.kcol-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.kcount{background:var(--line);color:var(--txt-2);font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
.kcol-sum{font-size:11.5px;color:var(--teal);font-weight:600;margin:2px 0 10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab}
.kcard:active{cursor:grabbing}
.kc-t{font-weight:600;font-size:12.5px}
.kc-v{color:var(--brand);font-weight:700;font-size:13px;margin-top:3px}
.kc-c{color:var(--txt-3);font-size:11px;margin-top:3px}
.kempty{color:var(--txt-3);font-size:11px;text-align:center;padding:10px}
/* ações de linha (editar/excluir) */
.acts{white-space:nowrap;text-align:right}
.acts button{width:30px;height:30px;border-radius:8px;color:var(--txt-3);background:var(--surface-2);margin-left:6px;vertical-align:middle}
.acts button:hover{color:var(--txt);background:var(--line)}
.acts button svg{width:15px;height:15px}
.efield{margin-bottom:12px}
.efield label{display:block;font-size:12px;color:var(--txt-2);margin-bottom:5px}
/* credenciais do cliente criado */
.creds-ov{position:fixed;inset:0;background:rgba(5,8,15,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.creds-card{width:100%;max-width:440px;background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:var(--shadow);padding:26px;animation:cpop .2s ease}
@keyframes cpop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.creds-card h3{font-size:19px;margin-bottom:6px}
.creds-box{margin-top:14px;display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.creds-box .cr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2)}
.creds-box .cr span{color:var(--txt-3);font-size:12px}
.creds-box .cr b{font-family:Sora;font-size:14px;word-break:break-all;text-align:right}
</style>
</head>
<body>

<!-- tela de carregamento inicial -->
<div id="boot"><span class="spin"></span></div>

<!-- LOGIN -->
<div id="login" class="hide">
  <form class="lcard" id="f-login" onsubmit="doLogin(event)">
    <div class="mark">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7c6bff"/><path d="M9 23V9l14 14V9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>NEXORA</b>
    </div>
    <div class="sub">Acesse sua conta</div>
    <div class="badge">PLATAFORMA</div>
    <div class="field"><label>E-mail</label><input type="email" id="email" required autocomplete="email" placeholder="voce@email.com"></div>
    <div class="field"><label>Senha</label><input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn btn-primary" id="loginBtn" type="submit">Entrar</button>
    <div class="forgot"><a onclick="showReset(event)">Esqueci minha senha</a></div>
    <div class="lmsg" id="lmsg"></div>
  </form>
  <form class="lcard hide" id="f-reset" onsubmit="enviarReset(event)">
    <div class="mark"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7c6bff"/><path d="M9 23V9l14 14V9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>NEXORA</b></div>
    <div class="sub">Recuperar senha</div>
    <div class="field"><label>Seu e-mail</label><input type="email" id="r-email" required placeholder="voce@email.com"></div>
    <button class="btn btn-primary" id="resetBtn" type="submit">Enviar link de recuperação</button>
    <div class="forgot"><a onclick="showLogin(event)">Voltar ao login</a></div>
    <div class="lmsg" id="rmsg"></div>
  </form>
  <form class="lcard hide" id="f-newpass" onsubmit="salvarNovaSenha(event)">
    <div class="mark"><svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7c6bff"/><path d="M9 23V9l14 14V9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><b>NEXORA</b></div>
    <div class="sub">Defina sua nova senha</div>
    <div class="field"><label>Nova senha</label><input type="password" id="np-senha" required minlength="6" placeholder="mínimo 6 caracteres"></div>
    <button class="btn btn-primary" id="npBtn" type="submit">Salvar nova senha</button>
    <div class="lmsg" id="npmsg"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="mark">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="#7c6bff"/><path d="M9 23V9l14 14V9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>NEXORA</b>
    </div>
    <span class="pill" id="rolePill"></span>
    <div class="sp"></div>
    <div class="avatar" id="avatar">U</div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
  </div>
  <div class="content" id="view"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ===== CONFIG (projeto NEXORA) ===== */
const SUPABASE_URL='https://sdedjeucvmapviqdzmmn.supabase.co';
const SUPABASE_KEY='sb_publishable_tGQH4edEciMj5_U0AgKZaw_Iw4sm25b';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let PERFIL=null, USER=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BRL=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function show(el){el.classList.remove('hide');}
function hideEl(el){el.classList.add('hide');}

/* ===== BOOT: já tem sessão? ===== */
function showLogin(e){if(e)e.preventDefault();show($('login'));$('f-login').classList.remove('hide');$('f-reset').classList.add('hide');$('f-newpass').classList.add('hide');}
function showReset(e){if(e)e.preventDefault();show($('login'));$('f-login').classList.add('hide');$('f-reset').classList.remove('hide');$('f-newpass').classList.add('hide');}
function showNewPass(){show($('login'));$('f-login').classList.add('hide');$('f-reset').classList.add('hide');$('f-newpass').classList.remove('hide');}
let RECOVERING=false;
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){RECOVERING=true;hideEl($('boot'));showNewPass();}});
(async function boot(){
  if(location.hash.indexOf('type=recovery')>=0){RECOVERING=true;hideEl($('boot'));showNewPass();return;}
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(RECOVERING)return;
    if(session){await entrar(session.user);}
    else{hideEl($('boot'));showLogin();}
  }catch(e){hideEl($('boot'));showLogin();lmsg('Falha ao conectar. Verifique a internet.',true);}
})();
async function enviarReset(ev){ev.preventDefault();const btn=$('resetBtn');btn.disabled=true;const old=btn.textContent;btn.innerHTML='<span class="spin"></span>';const email=$('r-email').value.trim();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});btn.disabled=false;btn.textContent=old;const m=$('rmsg');if(error){m.className='lmsg err';m.textContent=error.message;}else{m.className='lmsg ok';m.textContent='Link enviado! Confira seu e-mail (e a caixa de spam).';}}
async function salvarNovaSenha(ev){ev.preventDefault();const btn=$('npBtn');btn.disabled=true;const old=btn.textContent;btn.innerHTML='<span class="spin"></span>';const senha=$('np-senha').value;const {error}=await sb.auth.updateUser({password:senha});btn.disabled=false;btn.textContent=old;const m=$('npmsg');if(error){m.className='lmsg err';m.textContent=error.message;}else{m.className='lmsg ok';m.textContent='Senha alterada! Entrando…';try{history.replaceState(null,'',location.pathname);}catch(_){}RECOVERING=false;setTimeout(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)entrar(session.user);else showLogin();},1300);}}

function lmsg(m,err){const el=$('lmsg');el.textContent=m;el.className='lmsg '+(err?'err':'ok');}

/* ===== LOGIN ===== */
async function doLogin(ev){
  ev.preventDefault();
  const btn=$('loginBtn');btn.disabled=true;const old=btn.textContent;btn.innerHTML='<span class="spin"></span>';
  lmsg('',false);$('lmsg').className='lmsg';

const NBIZ={clinica:['Clínica','Instituto','Centro Médico','Espaço Saúde'],petshop:['Pet Shop','Mundo Pet','Cão & Cia','Reino Animal'],barbearia:['Barbearia','Barber','Navalha'],estetica:['Studio','Espaço','Belle'],academia:['Academia','Fit','Box','Studio'],restaurante:['Restaurante','Cantina','Sabor'],odonto:['Odonto','Sorriso','OdontoCenter'],salao:['Salão','Beleza','Studio'],loja:['Loja','Store','Boutique'],advocacia:['Advocacia','Escritório'],default:['Grupo','Centro','Studio','Espaço','Casa']};
const NSOBR=['Vida','Prime','Bella','Nova','Central','Premium','Dom','Vitória','Aurora','Master','Real','Ouro','Horizonte','Vitale','Mais','Elite'];
const NSINAIS=[{s:'Sem site próprio',serv:'Site'},{s:'Controle em caderno (sem CRM)',serv:'CRM'},{s:'Demora pra responder no WhatsApp',serv:'Follow-up'},{s:'Não investe em tráfego pago',serv:'Tráfego'},{s:'Poucas avaliações no Google',serv:'Consultoria'},{s:'Instagram parado',serv:'Tráfego'},{s:'Agendamento manual',serv:'CRM'}];
function nSegKey(seg){const s=(seg||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');if(s.includes('pet'))return'petshop';if(s.includes('barb'))return'barbearia';if(s.includes('estet')||s.includes('belez'))return'estetica';if(s.includes('odont')||s.includes('dent'))return'odonto';if(s.includes('acad')||s.includes('fit')||s.includes('gym'))return'academia';if(s.includes('rest')||s.includes('lanch')||s.includes('pizz'))return'restaurante';if(s.includes('salao')||s.includes('cabel'))return'salao';if(s.includes('clin')||s.includes('saude')||s.includes('medic'))return'clinica';if(s.includes('adv')||s.includes('jurid'))return'advocacia';if(s.includes('loja')||s.includes('stor')||s.includes('moda')||s.includes('roupa'))return'loja';return'default';}
function iaProspBiz(seg,cidade,uf,n){const seed=pHash('biz|'+(seg||'')+'|'+(cidade||'')+'|'+(uf||''));const R=pRng(seed||7);const key=nSegKey(seg);const pick=a=>a[Math.floor(R()*a.length)];const bet=(a,b)=>Math.floor(R()*(b-a+1))+a;const seg2=seg&&seg.trim()?seg.trim():'Empresas';const out=[],us=new Set();for(let i=0;i<n;i++){let nome,g=0;do{nome=pick(NBIZ[key])+' '+pick(NSOBR);g++;}while(us.has(nome)&&g<14);us.add(nome);const pool=NSINAIS.slice(),sin=[],ns=bet(2,3);for(let k=0;k<ns&&pool.length;k++)sin.push(pool.splice(Math.floor(R()*pool.length),1)[0]);const serv=[...new Set(sin.map(x=>x.serv))];const h='@'+nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');out.push({id:'nb'+seed.toString(36)+i,nome,segmento:seg2,cidade:cidade||'—',uf:uf||'',tel:'(31) 9'+bet(1000,9999)+'-'+bet(1000,9999),insta:h,sinais:sin.map(x=>x.s),servicos:serv,score:bet(62,97)});}return out.sort((a,b)=>b.score-a.score);}

async function delRow(table,id,after){if(!confirm('Excluir este registro? Não dá pra desfazer.'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)return toast('Erro: '+error.message);toast('Excluído ✓');if(after)after();}
function openEdit(table,rec,after){
  const fields=EDIT_FIELDS[table]||[];
  const body=fields.map(([k,lbl,type])=>{const val=rec[k]==null?'':rec[k];
    if(type&&type.indexOf('select:')===0){const opts=type.slice(7).split(',');return `<div class="efield"><label>${lbl}</label><select class="inp" data-k="${k}">${opts.map(o=>`<option ${String(val)===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;}
    const it=type==='number'?'number':type==='date'?'date':'text';
    return `<div class="efield"><label>${lbl}</label><input class="inp" data-k="${k}" type="${it}" value="${esc(val)}"></div>`;}).join('');
  const d=document.createElement('div');d.className='creds-ov';
  d.innerHTML=`<div class="creds-card"><h3>Editar</h3><div class="eform">${body}</div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn btn-ghost" onclick="this.closest('.creds-ov').remove()">Cancelar</button><button class="btn btn-primary" id="e-save">Salvar</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#e-save').onclick=async()=>{const upd={};d.querySelectorAll('[data-k]').forEach(el=>{let v=el.value;if(el.type==='number')v=Number(v||0);if(v==='')v=null;upd[el.getAttribute('data-k')]=v;});const {error}=await sb.from(table).update(upd).eq('id',rec.id);if(error)return toast('Erro: '+error.message);d.remove();toast('Salvo ✓');if(after)after();};
}

    </div>`);
  const [cCli,cLead,cVend]=await Promise.all([
    sb.from('clientes').select('*',{count:'exact',head:true}),

  const {data:vd}=await sb.from('vendas').select('total,criado_em');
  $('k-fat').textContent=BRL((vd||[]).reduce((s,v)=>s+Number(v.total||0),0));
  const {data:ld}=await sb.from('leads').select('origem');
  drawDash(vd||[],ld||[]);
}
function chartBase(){return {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7390',font:{size:11}},grid:{display:false}},y:{ticks:{color:'#6b7390',font:{size:11}},grid:{color:'#1a2236'},beginAtZero:true}}};}
function drawDash(vendas,leads){
  if(typeof Chart==='undefined')return;
  const now=new Date();const meses=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);meses.push({key:d.getFullYear()+'-'+(d.getMonth()+1),lbl:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),v:0});}
  vendas.forEach(x=>{const d=new Date(x.criado_em);const k=d.getFullYear()+'-'+(d.getMonth()+1);const m=meses.find(mm=>mm.key===k);if(m)m.v+=Number(x.total||0);});
  const cv=$('chVendas');if(cv)empCharts.push(new Chart(cv,{type:'bar',data:{labels:meses.map(m=>m.lbl),datasets:[{data:meses.map(m=>m.v),backgroundColor:'#7c6bff',borderRadius:6,maxBarThickness:38}]},options:chartBase()}));
  const byO={};leads.forEach(l=>{const o=l.origem||'Outros';byO[o]=(byO[o]||0)+1;});
  const labels=Object.keys(byO),vals=Object.values(byO);
  const cores=['#7c6bff','#2dd4a0','#4e9bff','#f0a23c','#f0666b','#a78bfa','#38bdf8'];
  const cl=$('chLeads');if(cl)empCharts.push(new Chart(cl,{type:'doughnut',data:{labels:labels.length?labels:['Sem leads ainda'],datasets:[{data:vals.length?vals:[1],backgroundColor:labels.length?cores:['#232b42'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{display:labels.length>0,position:'bottom',labels:{color:'#9aa2bd',font:{size:11},padding:12,usePointStyle:true}}}}}));
}

async function ensureEtapas(){

  if(data&&data.length)return data;
  const defs=[['Novo contato',1,10],['Qualificação',2,30],['Proposta',3,55],['Negociação',4,75],['Fechado',5,95]];
  await sb.from('funil_etapas').insert(defs.map(([nome,ordem,prob])=>({empresa_id:EID(),nome,ordem,prob})));
  const {data:d2}=await sb.from('funil_etapas').select('*').order('ordem');return d2||[];
}

function kanbanDrag(e,id){kanbanId=id;e.dataTransfer.effectAllowed='move';}

  const {data,error}=await sb.from('oportunidades').select('*').order('criado_em',{ascending:false});
  const cmap={};(cls||[]).forEach(c=>cmap[c.id]=c.nome);
  if(error)return $('lst').innerHTML=`<div class="empty">Erro: ${esc(error.message)}</div>`;
  if(!data.length)return $('lst').innerHTML='<div class="empty">Nenhuma oportunidade ainda.</div>';
  empLast.oportunidades=data;
  $('lst').innerHTML=`<table><thead><tr><th>Título</th><th>Cliente</th><th>Etapa</th><th>Status</th><th>Valor</th><th></th></tr></thead><tbody>${data.map(o=>`<tr><td><b>${esc(o.titulo||'—')}</b></td><td>${esc(cmap[o.cliente_id]||'—')}</td><td>${esc(o.etapa||'—')}</td><td>${esc(o.status||'Aberta')}</td><td><b>${BRL(o.valor)}</b></td>${acts('oportunidades',o.id)}</tr>`).join('')}</tbody></table>`;
}
async function addOpp(){const cli=$('o-cli')?.value;if(!cli)return toast('Cadastre um cliente primeiro');const tit=$('o-tit').value.trim();const val=Number($('o-val').value||0);if(!tit&&!val)return toast('Preencha título ou valor');const r=await ins('oportunidades',{cliente_id:cli,titulo:tit||null,valor:val,etapa:$('o-eta').value,status:'Aberta'});if(!r.error){toast('Oportunidade criada ✓');empOpps();}}

async function addProp(){const cli=$('p-cli')?.value;if(!cli)return toast('Cadastre um cliente primeiro');const tot=Number($('p-tot').value||0);const r=await ins('propostas',{cliente_id:cli,numero:'PROP-'+Date.now().toString().slice(-5),total:tot,status:$('p-sta').value});if(!r.error){toast('Proposta criada ✓');empProps();}}

/* -- Prospecção IA (busca os possíveis clientes DA empresa) -- */
const PG_NAMES=['Marcos Vieira','Patrícia Lopes','Rafael Nunes','Juliana Castro','Fernando Alves','Beatriz Rocha','Gustavo Pinto','Larissa Melo','Thiago Barros','Vanessa Cardoso','Rodrigo Faria','Amanda Reis','Leonardo Dias','Priscila Gomes','Henrique Sousa','Natália Freitas','Camila Duarte','Bruno Teixeira','Aline Moraes','Diego Ramos'];
const PBAIRROS=['Centro','Jardim das Flores','Vila Nova','Santa Cruz','Bela Vista','São José','Cidade Alta','Boa Esperança'];
const PCLIENT_SINAIS=['Buscou esse serviço na região','Ainda não é seu cliente','Perfil compatível com seu público','Segue concorrentes no Instagram','Interagiu com anúncios do segmento','Mora/atua perto de você','Pediu orçamento recentemente'];
function pHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function pRng(seed){let s=seed||1;return ()=>{s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function iaProspecta(nicho,cidade,uf,n){
  const seed=pHash((nicho||'')+'|'+(cidade||'')+'|'+(uf||''));const R=pRng(seed||7);
  const pick=a=>a[Math.floor(R()*a.length)];const bet=(a,b)=>Math.floor(R()*(b-a+1))+a;
  const out=[],us=new Set();
  for(let i=0;i<n;i++){
    let nome,g=0;do{nome=pick(PG_NAMES);g++;}while(us.has(nome)&&g<30);us.add(nome);
    const pool=PCLIENT_SINAIS.slice(),sin=[],ns=bet(1,2);for(let k=0;k<ns&&pool.length;k++)sin.push(pool.splice(Math.floor(R()*pool.length),1)[0]);
    const h='@'+nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'').slice(0,13);
    out.push({id:'pr'+seed.toString(36)+i,nome,bairro:pick(PBAIRROS),cidade:cidade||'—',uf:uf||'',tel:'(31) 9'+bet(1000,9999)+'-'+bet(1000,9999),insta:h,sinais:sin,score:bet(62,97)});
  }
  return out.sort((a,b)=>b.score-a.score);
}
let PRES=[],PFORM={nicho:'',cid:'',uf:''},PLOAD=false;
const pIco='M12 2v3M12 19v3M2 12h3M19 12h3M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8';
function empProsp(){
  if(!PFORM.nicho&&EMP_INFO&&EMP_INFO.segmento)PFORM.nicho=EMP_INFO.segmento;
  const f=PFORM;
  const res=PLOAD?`<div class="empty prosp-loading">${mi(pIco)}<div>Buscando possíveis clientes em ${esc(f.cid||'sua região')}…</div></div>`
    :PRES.length?`<div class="prosp-count">${PRES.length} possíveis clientes encontrados perto de você</div><div class="prosp-grid">${PRES.map(pcard).join('')}</div>`
    :`<div class="empty">${mi(pIco)}<div>Informe o que você atende e a região — a IA encontra <b>possíveis clientes para a ${esc((EMP_INFO&&EMP_INFO.nome)||'sua empresa')}</b>.</div></div>`;
  cmain(phead('Buscar clientes com IA','A IA encontra possíveis clientes para o seu negócio, por região.')+`
    <div class="card" style="margin-bottom:16px"><div class="card-b"><div class="row">
      <div><label>O que você atende / público-alvo</label><input class="inp" id="pr-nic" value="${esc(f.nicho)}" placeholder="Ex.: corte masculino, estética, pet"></div>
      <div><label>Cidade</label><input class="inp" id="pr-cid" value="${esc(f.cid)}" placeholder="Ex.: Caratinga"></div>
      <div style="max-width:90px"><label>UF</label><input class="inp" id="pr-uf" value="${esc(f.uf)}" maxlength="2" placeholder="MG"></div>
      <button class="btn btn-primary" style="width:auto" onclick="prospBuscar()">Buscar com IA</button>
    </div></div></div>
    <div id="pres">${res}</div>`);
}
function pcard(p){return `<div class="prosp-card" id="pc-${p.id}">
  <div class="pc-top"><div class="pc-av">${esc(p.nome[0])}</div><div class="pc-id"><div class="pc-nm">${esc(p.nome)}</div><div class="pc-sub">${esc(p.bairro)} · ${esc(p.cidade)}${p.uf?'/'+esc(p.uf):''}</div></div><div class="pc-score" title="Chance de virar cliente">${p.score}</div></div>
  <div class="pc-contact">${esc(p.tel)} · ${esc(p.insta)}</div>
  <div class="pc-sec">Por que é um bom lead</div><div class="pc-sinais">${p.sinais.map(s=>`<span class="pc-tag warn">${esc(s)}</span>`).join('')}</div>
  <button class="btn btn-primary btn-sm pc-add" onclick="prospAddLead('${p.id}')">Adicionar como lead</button></div>`;
}
function prospBuscar(){PFORM={nicho:$('pr-nic').value.trim(),cid:$('pr-cid').value.trim(),uf:$('pr-uf').value.trim().toUpperCase()};if(!PFORM.nicho)return toast('Diga o que você atende');PLOAD=true;empProsp();setTimeout(()=>{PRES=iaProspecta(PFORM.nicho,PFORM.cid,PFORM.uf,6);PLOAD=false;empProsp();},800);}
async function prospAddLead(id){const p=PRES.find(x=>x.id===id);if(!p)return;const r=await ins('leads',{nome:p.nome,empresa_nome:null,origem:'Prospecção IA',temperatura:p.score>=85?'Quente':p.score>=72?'Morno':'Frio',status:'Novo',telefone:p.tel});if(r.error)return;const c=document.getElementById('pc-'+id);if(c){const b=c.querySelector('.pc-add');if(b)b.outerHTML='<div class="pc-added">✓ Adicionado como lead</div>';c.classList.add('done');}toast(p.nome+' → Leads ✓');}
